name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Check the CLI runs
        run: node dist/cli.js check --file test/fixtures/good.json

  action:
    name: action (fixture server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - name: Run the action on the probe fixture
        id: medic
        uses: ./
        with:
          command: node test/fixtures/probe-server.mjs
          probe: "true"
          fail-on: never
          badge: mcpmedic-badge.json
          sarif: mcpmedic.sarif
      - name: Check the outputs
        run: |
          test -s mcpmedic-report.html
          test -s mcpmedic-badge.json
          node -e 'const s=JSON.parse(require("fs").readFileSync("mcpmedic.sarif","utf8"));if(s.version!=="2.1.0")process.exit(1)'
          echo "Score: ${{ steps.medic.outputs.score }}"
          test -n "${{ steps.medic.outputs.score }}"
      - name: The action fails on errors when asked to
        id: strict
        continue-on-error: true
        uses: ./
        with:
          file: test/fixtures/bad.json
      - name: Check it failed
        run: test "${{ steps.strict.outcome }}" = "failure"

  package:
    name: package (install from tarball)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - name: Pack
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Install the tarball somewhere clean and run it
        run: |
          mkdir "$RUNNER_TEMP/try" && cd "$RUNNER_TEMP/try"
          npm init -y >/dev/null
          npm install "$RUNNER_TEMP"/jmozez-mcpmedic-*.tgz
          test "$(npx mcpmedic --version)" = "$(node -p 'require("'"$GITHUB_WORKSPACE"'/package.json").version')"
          npx mcpmedic check --file "$GITHUB_WORKSPACE/test/fixtures/good.json"
          npx mcpmedic hosts > /dev/null
          node --input-type=module -e 'import("@jmozez/mcpmedic").then(m => { if (typeof m.runRules !== "function") process.exit(1); })'
